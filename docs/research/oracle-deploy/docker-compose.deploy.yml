# Deployment compose for our Oracle box.
# Uses literal block scalars to keep setup script readable.

volumes:
  certs:
    driver: local
  esdata01:
    driver: local
  postgresdata:
    driver: local

networks:
  default:
    name: csapi-pygeoapi-net
    external: false

services:
  connected-systems-api:
    image: csapi-pygeoapi:local
    build:
      context: .
    environment:
      PYTHONUNBUFFERED: 1
      CSA_SERVER_BIND_HOST: 0.0.0.0
      CSA_SERVER_BIND_PORT: 5000
      CSA_SERVER_URL: "https://129-80-248-53.sslip.io/csapi-pygeoapi"
      CSA_CORS_ALLOW_ORIGIN: "*"
      CSA_QUART_AUTH_BASIC_READ: "false"
      CSA_QUART_AUTH_BASIC_READWRITE: "false"
      CSA_DYNAMIC-RESOURCES_CSA-PART1_PROVIDER_HOST: es01
      CSA_DYNAMIC-RESOURCES_CSA-PART1_PROVIDER_PASSWORD: password
      CSA_DYNAMIC-RESOURCES_CSA-PART1_PROVIDER_USER: elastic
      CSA_DYNAMIC-RESOURCES_CSA-PART2_PROVIDER_ELASTIC_HOST: es01
      CSA_DYNAMIC-RESOURCES_CSA-PART2_PROVIDER_ELASTIC_PASSWORD: password
      CSA_DYNAMIC-RESOURCES_CSA-PART2_PROVIDER_ELASTIC_USER: elastic
      CSA_DYNAMIC-RESOURCES_CSA-PART2_PROVIDER_TIMESCALE_HOST: timescaledb
      CSA_DYNAMIC-RESOURCES_CSA-PART2_PROVIDER_TIMESCALE_PASSWORD: password
      CSA_DYNAMIC-RESOURCES_CSA-PART2_PROVIDER_TIMESCALE_USER: timescaledb
      CSA_DYNAMIC-RESOURCES_CSA-PART2_PROVIDER_TIMESCALE_PORT: 5432
    ports:
      - "127.0.0.1:8285:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -nv --spider http://127.0.0.1:5000/ || exit 1"]
      interval: 15s
      timeout: 30s
      retries: 20
      start_period: 60s
    depends_on:
      es01:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb-ha:pg16
    environment:
      TIMESCALEDB_TELEMETRY: off
      POSTGRES_DB: csa
      POSTGRES_USER: timescaledb
      POSTGRES_PASSWORD: password
      ALLOW_IP_RANGE: 0.0.0.0/0
      POSTGRES_MULTIPLE_EXTENSIONS: postgis
    volumes:
      - postgresdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5434:5432"
    restart: unless-stopped

  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
    user: "0"
    command:
      - bash
      - -c
      - |
        set -e
        if [ ! -f config/certs/ca.zip ]; then
          echo "Creating CA"
          bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip
          unzip config/certs/ca.zip -d config/certs
        fi
        if [ ! -f config/certs/certs.zip ]; then
          echo "Creating certs"
          cat > config/certs/instances.yml <<EOF
        instances:
          - name: es01
            dns:
              - es01
              - localhost
            ip:
              - 127.0.0.1
        EOF
          bin/elasticsearch-certutil cert --silent --pem -out config/certs/certs.zip --in config/certs/instances.yml --ca-cert config/certs/ca/ca.crt --ca-key config/certs/ca/ca.key
          unzip config/certs/certs.zip -d config/certs
        fi
        echo "Setting file permissions"
        chown -R root:root config/certs
        find config/certs -type d -exec chmod 750 {} \;
        find config/certs -type f -exec chmod 640 {} \;
        echo "All done!"
    healthcheck:
      test: ["CMD-SHELL", "[ -f config/certs/es01/es01.crt ]"]
      interval: 2s
      timeout: 5s
      retries: 120

  es01:
    depends_on:
      setup:
        condition: service_completed_successfully
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    ports:
      - "127.0.0.1:9201:9200"
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - esdata01:/usr/share/elasticsearch/data
    environment:
      - node.name=es01
      - cluster.name=docker-cluster
      - discovery.type=single-node
      - ELASTIC_PASSWORD=password
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/es01/es01.key
      - xpack.security.http.ssl.certificate=certs/es01/es01.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/es01/es01.key
      - xpack.security.transport.ssl.certificate=certs/es01/es01.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=basic
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'"]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: unless-stopped
